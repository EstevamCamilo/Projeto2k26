        const exibeLicao = function () {
            //Entrada de dados
            let linhas = parseInt(document.querySelector('#linhas').value);
            if (linhas >= palavras.length) {
                linhas = palavras.length;
            }
            //Saída de dados
            let conteudo = document.querySelector('#conteudo');
            //Sorteia as palavras da lição
            let sorteadas = [];
            let pa = [];
            let im = [];
            for (let i = 0; i < linhas; i++) {
                let n;
                do {
                    n = parseInt(Math.random() * palavras.length);
                }
                while (
                    sorteadas.indexOf(n) > -1
                );
                sorteadas.push(n);
                pa.push(palavras[n].palavra);
                im.push(palavras[n].imagem);
            }
            pa.sort(() => (Math.random() > .5) ? 1 : -1);
            im.sort(() => (Math.random() > .5) ? 1 : -1);
