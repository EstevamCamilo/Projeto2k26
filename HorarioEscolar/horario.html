<!DOCTYPE html>
<html>
    <head>
        <title>horario.html</title>
    </head>
    <body>
        <form id="form" onsubmit="horarioUI.save(event)">
            <h2>Formulário de Horário</h2>
            <input name="id" type="number" value="-1" readonly hidden/>
            Ano<br/>
            <select name="ano" onchange="horarioUI.refreshSerie()"></select><br/><br/>
            Série<br/>
            <select name="serie" onchange="horarioUI.refreshGrade()"></select>
            
            <h2>Horário</h2>
            <table id="grade"></table>
            <button type="button" onclick="horarioUI.addHora()">+ ⌚</button>
            <button type="button" onclick="horarioUI.remHora()">- ⌚</button>

            <br/><br/>
            <button type="button" onclick="horarioUI.list()">⬅️Voltar</button>
            <button type="submit">💾 Salvar alterações</button>
        </form>

        <div id="table"></div>

    </body>
</html>
