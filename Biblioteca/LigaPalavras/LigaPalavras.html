            ,
        ];
        const exibeLicao = function () {
            const candidates = palavras.filter(item => item && typeof item.palavra === 'string' && item.palavra.trim());
            const quantity = QVCLegacy.count('linhas', candidates.length, 10);
            if (quantity === null) return;
            const selected = QVCLegacy.shuffle(candidates).slice(0, quantity);
            const figures = QVCLegacy.shuffle(selected);
            const content = QVCLegacy.prepare(document.getElementById('conteudo'), 'Ligue as palavras');
            const instruction = document.createElement('p');
            instruction.textContent = 'Ligue cada palavra à figura correspondente na outra coluna.';
            content.append(instruction);
            const list = document.createElement('div');
            list.className = 'qvc-matching-list';
            selected.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = 'qvc-matching-row';
                row.dataset.qvcWord = item.palavra;
                const word = document.createElement('strong');
                word.textContent = item.palavra;
                const leftPoint = document.createElement('span');
                leftPoint.textContent = '○';
                leftPoint.setAttribute('aria-hidden', 'true');
                const gap = document.createElement('span');
                gap.className = 'qvc-matching-gap';
                const rightPoint = leftPoint.cloneNode(true);
                const picture = document.createElement('span');
                picture.className = 'qvc-exercise-image';
                picture.textContent = figures[index].imagem || '✦';
                picture.setAttribute('role', 'img');
                picture.setAttribute('aria-label', figures[index].palavra);
                row.append(word, leftPoint, gap, rightPoint, picture);
                list.append(row);
            });
            content.append(list);
        };
        exibeLicao();
