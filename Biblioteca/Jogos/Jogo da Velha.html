<html>
    <head>
        <title>
        </title>
        <meta charset="utf-8">
    </head>
    <body>
        <h1># Jogo da Velha 
        </h1>
        <style>
            body {
                text-align: center;
            }
            .botao {
                margin: 5px;
                padding: 10px;
                font-size: 50px;
                width: 80px;
                height: 80px;
            }
            div {
                background-color: black;
                display: inline-block;
            }
        </style>
        <header>
            <a href="../index.html"><button id="vb"><img src="../volta.png"/></button></a>
            <h1>Jogo da velha!!</h1>
        </header>
        
        <div id="j">
            <button class="botao" id="b0" onclick="clicou(0)">&nbsp;
            </button>
            <button class="botao" id="b1" onclick="clicou(1)">&nbsp;
            </button>
            <button class="botao" id="b2" onclick="clicou(2)">&nbsp;
            </button>
            <br>
            <button class="botao" id="b3" onclick="clicou(3)">&nbsp;
            </button>
            <button class="botao" id="b4" onclick="clicou(4)">&nbsp;
            </button>
            <button class="botao" id="b5" onclick="clicou(5)">&nbsp;
            </button>
            <br>
            <button class="botao" id="b6" onclick="clicou(6)">&nbsp;
            </button>
            <button class="botao" id="b7" onclick="clicou(7)">&nbsp;
            </button>
            <button class="botao" id="b8" onclick="clicou(8)">&nbsp;
            </button>
            <br>
        </div>
        <script>
            var vez = 0;
            var clicou = (botoes) => {
                if(vez%2 === 0) {
                    document.querySelector("#b"+botoes).innerHTML = "X";
                }
                else {
                    document.querySelector("#b"+botoes).innerHTML = "O";
                }
                vez = vez + 1
            };
            //MODAL
            var modal = {
                //Gerencia modal
                showDialog: function (content, id) {
                    console.log(content);
                    console.log(id)
                    console.log(typeof (content));
                    let overlay = document.createElement("div");
                    overlay.id = id === undefined ? "o" + new Date().getTime() : id;
                    overlay.style.position = "absolute";
                    overlay.style.top = overlay.style.bottom = overlay.style.left = overlay.style.right = "0";
                    overlay.style.backgroundColor = "rgba(255,255,255,0.5)";
                    overlay.style.display = "flex";
                    overlay.style.alignItems = overlay.style.justifyContent = "center";
                    let dialog = document.createElement("div");
                    dialog.style.display = "inline-block";
                    dialog.style.padding = "1rem";
                    dialog.style.borderRadius = "1rem";
                    dialog.style.boxShadow = "0 0 1em black";
                    dialog.style.backgroundColor = "white";
                    let bClose = document.createElement("button");
                    bClose.innerHTML = "<img src='cross.png'/>";
                    bClose.style.position = "relative";
                    bClose.style.float = "right";
                    bClose.style.border = "none";
                    bClose.style.background = "none";
                    bClose.style.fontSize = "30px";
                    bClose.onclick = () => this.closeDialog(id);
                    dialog.appendChild(bClose);
                    if (typeof (content) === "string" || content instanceof String) {
                        let element = document.createElement("div");
                        element.innerHTML = content;
                        dialog.appendChild(element);
                    } else {
                        dialog.appendChild(content);
                    }

                    overlay.appendChild(dialog);
                    document.body.appendChild(overlay);
                }
                ,
                closeDialog: function (id) {
                    document.body.removeChild(document.querySelector("#" + id));
                }
            };
            const sobre = function () {
                let html = "";
                html += "<img src='logo2.png' id='lg'/>";
                html += "<h1 id='l'>Caça Palavras </h1>";
                html += "<h2 id=''>Criadores:</h2>";
                html += "<p id='n'>Matheus Henrique Queiroz da Silva</p>";
                html += "<p id='n'>Estevam Fernandes Camilo</p>";
                html += "<p id='n'>Juan Henrique Conceição Veronez</p>";
                html += "<h1 id=''>QVC.org - Up Software para o futuro!</h1>";
                html += "<p id='s'>Site: http://QVC.org</p>";
                html += "<p id='s'>Contato: org.QVC@gmail.com</p>";
                html += "<p id='s'>Suporte: suporteQVC.org@gmail.com</p>";
                modal.showDialog(html, "Sobre");
            }
        </script>
    </body></html>
