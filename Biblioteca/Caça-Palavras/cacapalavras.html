            const crialicao = function () {
                const category = document.getElementById('categorias').value;
                const candidates = Array.isArray(palavras[category]) ? palavras[category].filter(item => item && typeof item.palavra === 'string' && item.palavra.trim()) : [];
                const quantity = QVCLegacy.count('npalavras', candidates.length, 25);
                if (quantity === null) return;
                const selected = QVCLegacy.shuffle(candidates).slice(0, quantity).map(item => item.palavra.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLocaleUpperCase('pt-BR'));
                // Every attempt is finite. Distinct-row placement guarantees a fallback for all words.
                const size = Math.max(22, selected.length, ...selected.map(word => word.length));
                const grid = Array.from({ length: size }, () => Array(size).fill(''));
                const placements = [];
                const directions = [[1, 0], [0, 1], [1, 1], [-1, 1]];
                let fallback = false;
                for (const word of [...selected].sort((a, b) => b.length - a.length)) {
                    let found = false;
                    const starts = QVCLegacy.shuffle(Array.from({ length: size * size }, (_, i) => [i % size, Math.floor(i / size)]));
                    for (const [startX, startY] of starts) {
                        for (const [dx, dy] of QVCLegacy.shuffle(directions)) {
                            const cells = Array.from(word, (_, i) => [startX + dx * i, startY + dy * i]);
                            if (!cells.every(([x, y], i) => x >= 0 && y >= 0 && x < size && y < size && (!grid[y][x] || grid[y][x] === word[i]))) continue;
                            cells.forEach(([x, y], i) => { grid[y][x] = word[i]; });
                            placements.push({ word, cells });
                            found = true;
                            break;
                        }
                        if (found) break;
                    }
                    if (!found) { fallback = true; break; }
                }
                if (fallback) {
                    grid.forEach(row => row.fill(''));
                    placements.length = 0;
                    selected.forEach((word, y) => {
                        const cells = Array.from(word, (_, x) => [x, y]);
                        cells.forEach(([x, row], i) => { grid[row][x] = word[i]; });
                        placements.push({ word, cells });
                    });
                }
                grid.forEach(row => row.forEach((letter, i) => { if (!letter) row[i] = String.fromCharCode(65 + Math.floor(Math.random() * 26)); }));
                const content = QVCLegacy.prepare(document.getElementById('conteudo'), 'Caça-palavras');
                const instruction = document.createElement('p');
                instruction.className = 'qvc-wordsearch-instruction';
                instruction.textContent = 'Encontre e circule as palavras. As letras da grade aparecem sem acentos.';
                const table = document.createElement('table');
                table.id = 'tabela';
                table.className = 'qvc-wordsearch-grid';
                table.setAttribute('aria-label', 'Grade do caça-palavras');
                table.dataset.qvcPlacements = JSON.stringify(placements);
                const body = document.createElement('tbody');
                grid.forEach(row => {
                    const line = document.createElement('tr');
                    row.forEach(letter => {
                        const cell = document.createElement('td');
                        cell.textContent = letter;
                        line.append(cell);
                    });
                    body.append(line);
                });
                table.append(body);
                const list = document.createElement('ul');
                list.className = 'qvc-wordsearch-list';
                list.setAttribute('aria-label', 'Palavras para encontrar');
                selected.forEach(word => {
                    const item = document.createElement('li');
                    item.textContent = word;
                    list.append(item);
                });
                content.append(instruction, table, list);
                document.getElementById('Id1').replaceChildren();
            };
