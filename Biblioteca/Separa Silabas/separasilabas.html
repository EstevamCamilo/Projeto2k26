            const exibeLicao = function () {
                //Entrada de dados
                let linhas = parseInt(document.querySelector('#linhas').value);
                let maximo = parseInt(document.querySelector('#maximo').value);
                if (linhas >= palavras.length) {
                    linhas = palavras.length;
                }
                //Saída de dados
                let conteudo = document.querySelector('#conteudo');
                //Sorteia as palavras da lição
                let sorteadas = [];
                for (let i = 0; i < linhas; i++) {
                    let n;
                    do {
                        n = parseInt(Math.random() * palavras.length);
                    }
                    while (
                        sorteadas.indexOf(n) > -1 ||
                        palavras[n].silabas > maximo
                    );
                    sorteadas.push(n);
                }
                //Cria cabeçalho

                cabe += '</tr>';

                html += '<tr>';
                for (let i = 0; i < linhas; i++) {
                    let palavra = palavras[sorteadas[i]];
                    html += "<td style='text-align:left'>";
                    html += palavra.imagem + ' ';
                    html += palavra.palavra + ' ';
                    for (let j = 0; j < palavra.silabas; j++) {
                        html += '____&nbsp;&nbsp;';
                    }
                    if (i % 2 === 1) {
                        html += '<tr>';
                    }
                }
                html += '</table>';
                conteudo.innerHTML = cabe;
